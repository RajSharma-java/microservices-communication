spring.application.name=gateway-service
server.port=9091

# User Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Order Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
